name: Build and test
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Unit and API tests with coverage gate
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Angular application
        working-directory: frontend
        run: npm run build
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
      - name: Validate production compose
        run: POSTGRES_PASSWORD=ci JWT_KEY=ci-not-used-in-this-step CADDY_EMAIL=ci@example.com ADMIN_EMAIL=ci@example.com docker compose -f docker-compose.prod.yml config >/dev/null
