name: Build and test
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Restore
        run: dotnet restore JobTracker.sln
      - name: Build
        run: dotnet build JobTracker.sln --configuration Release --no-restore
      - name: Unit tests with coverage gate
        run: >
          dotnet test src/JobTracker.Tests/JobTracker.Tests.csproj --configuration Release --no-build
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:Threshold=15 -p:ThresholdType=line -p:ThresholdStat=total
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build Angular application
        working-directory: frontend
        run: npm run build
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
      - name: Validate production compose
        run: POSTGRES_PASSWORD=ci JWT_KEY=ci-not-used-in-this-step CADDY_EMAIL=ci@example.com ADMIN_EMAIL=ci@example.com docker compose -f docker-compose.prod.yml config >/dev/null
  deploy:
    name: Deploy to droplet
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync and start stack
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${KEY:-}" ]; then
            echo "Skipping deploy. Add DROPLET_HOST, DROPLET_USER, and DROPLET_SSH_KEY repository secrets."
            exit 0
          fi
          USER="${USER:-root}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$HOST" >> "$HOME/.ssh/known_hosts"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '**/bin/' \
            --exclude '**/obj/' \
            --exclude 'node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude 'frontend/.angular/' \
            ./ "${USER}@${HOST}:/opt/suffertracker/"
          ssh "${USER}@${HOST}" 'set -euo pipefail
            cd /opt/suffertracker
            test -f .env
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build'
