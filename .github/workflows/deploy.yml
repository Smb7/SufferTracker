name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync files to droplet
        env:
          HOST: ${{ secrets.DROPLET_IP }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$HOST" >> "$HOME/.ssh/known_hosts"
          ssh "root@${HOST}" 'mkdir -p /opt/suffertracker'
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '**/bin/' \
            --exclude '**/obj/' \
            --exclude 'node_modules/' \
            --exclude 'frontend/dist/' \
            --exclude 'frontend/.angular/' \
            ./ "root@${HOST}:/opt/suffertracker/"
      - name: Start stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CADDY_EMAIL: ${{ secrets.CADDY_EMAIL }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ADMIN_EMAIL,ADMIN_PASSWORD,CADDY_EMAIL,JWT_KEY,LLM_API_KEY,POSTGRES_PASSWORD
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            cd /opt/suffertracker
            bash scripts/setup-droplet.sh
            docker compose -f docker-compose.prod.yml --env-file .env down
            bash scripts/free-http-ports.sh
            docker image prune -f
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build
