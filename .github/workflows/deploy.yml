name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CADDY_EMAIL: ${{ secrets.CADDY_EMAIL }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ADMIN_EMAIL,ADMIN_PASSWORD,CADDY_EMAIL,JWT_KEY,LLM_API_KEY,POSTGRES_PASSWORD
          script_stop: true
          script: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y git
            mkdir -p /opt/suffertracker
            cd /opt/suffertracker
            if [ ! -d .git ]; then
              git clone https://github.com/Smb7/SufferTracker.git /opt/suffertracker
            fi
            git fetch origin main
            git reset --hard origin/main
            bash scripts/setup-droplet.sh
            docker compose -f docker-compose.prod.yml --env-file .env down
            docker image prune -f
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build
