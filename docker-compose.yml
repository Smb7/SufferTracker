services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suffertracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suffertracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/suffertracker
      JWT_KEY: ${JWT_KEY:-local-development-secret-change-me}
      JWT_ISSUER: SufferTracker
      JWT_AUDIENCE: SufferTracker.Web
      FRONTEND_ORIGIN: http://localhost:4200
      ADMIN_EMAILS: smoke@test.com
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OCR_ENDPOINT: ${OCR_ENDPOINT:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_API_KEY_HEADER: ${OCR_API_KEY_HEADER:-Ocp-Apim-Subscription-Key}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        MAP_APIKEY: ${MAP_APIKEY:-}
    environment:
      MAP_APIKEY: ${MAP_APIKEY:-}
    ports:
      - "4200:80"
    depends_on:
      - api
volumes:
  postgres-data:
