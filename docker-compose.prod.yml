services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suffertracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suffertracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: src/JobTracker.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=suffertracker;Username=postgres;Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      FrontendOrigin: https://suffertracker.net
      Admin__Emails__0: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      Ocr__Endpoint: ${OCR_ENDPOINT:-}
      Ocr__ApiKey: ${OCR_API_KEY:-}
      Ocr__ApiKeyHeader: ${OCR_API_KEY_HEADER:-Ocp-Apim-Subscription-Key}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        MAP_APIKEY: ${MAP_APIKEY:-}
    depends_on:
      - api
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - api
    restart: unless-stopped
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
