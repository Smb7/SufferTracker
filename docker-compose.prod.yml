services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suffertracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d suffertracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/suffertracker
      JWT_KEY: ${JWT_KEY}
      JWT_ISSUER: SufferTracker
      JWT_AUDIENCE: SufferTracker.Web
      FRONTEND_ORIGIN: https://suffertracker.net
      ADMIN_EMAILS: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OCR_ENDPOINT: ${OCR_ENDPOINT:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_API_KEY_HEADER: ${OCR_API_KEY_HEADER:-Ocp-Apim-Subscription-Key}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        MAP_APIKEY: ${MAP_APIKEY:-}
    environment:
      MAP_APIKEY: ${MAP_APIKEY:-}
    depends_on:
      - api
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - api
    restart: unless-stopped
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
